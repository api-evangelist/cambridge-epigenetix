description: 'Cambridge Epigenetix is the Cambridge, UK genomics and epigenetics company
  founded on the six-base genome — resolving the four canonical DNA bases plus
  5-methylcytosine and 5-hydroxymethylcytosine from a single low-input sample in one
  experiment — and it rebranded to biomodal in 2023. DUPLICATE RECORD: this stub was
  created from the secondary-market harvest backlog (Forge Global listing) under the
  company''s former name and profiles the same company already held in the API
  Evangelist network as all/biomodal, which carries the live profile (CLI command
  surface, domain security, blog archive, screenshots and Kin Score history). The
  legacy domain cambridge-epigenetix.com now 301-redirects to biomodal.com, so there
  is no independent Cambridge Epigenetix surface to profile. No API surface has been
  registered here and no artifacts have been generated, so this record does not split
  the company across two Kin Scores. It is queued for the duplicate-retirement
  procedure (survivor: biomodal).'
